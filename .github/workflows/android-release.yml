name: Android Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach APK (e.g. v0.31.4)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          NDK_VERSION=$(ls -1 /usr/local/lib/android/sdk/ndk 2>/dev/null | sort -V | tail -n 1)
          if [[ -z "$NDK_VERSION" ]]; then
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            NDK_VERSION="26.1.10909125"
          fi
          echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/$NDK_VERSION" >> $GITHUB_ENV
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build frontend
        run: bun run build

      - name: Initialize Tauri Android project
        run: |
          bun tauri android init --ci --skip-targets-install

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          bun tauri android build --apk --target aarch64

      - name: Sign APK
        id: sign-apk
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TARGET_TAG="$TAG"
          if [[ -z "$TARGET_TAG" ]]; then
            TARGET_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          UNSIGNED_APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          if [[ -z "$UNSIGNED_APK" ]]; then
            echo "Error: No APK found"
            exit 1
          fi
          echo "Found unsigned APK at: $UNSIGNED_APK"

          # Generate release keystore
          keytool -genkey -v -keystore release.keystore -alias anchoa -keyalg RSA -keysize 2048 -validity 10000 -storepass anchoarelease -keypass anchoarelease -dname "CN=Anchoa, OU=Anchoa, O=Anchoa, L=Jakarta, ST=Jakarta, C=ID"

          ZIPALIGN=$(find /usr/local/lib/android/sdk/build-tools -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using zipalign at: $ZIPALIGN"
          echo "Using apksigner at: $APKSIGNER"

          ALIGNED_APK="aligned-${TARGET_TAG}.apk"
          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          OUTPUT_APK="Anchoa-${TARGET_TAG}.apk"
          "$APKSIGNER" sign --ks release.keystore --ks-key-alias anchoa --ks-pass pass:anchoarelease --key-pass pass:anchoarelease --out "$OUTPUT_APK" "$ALIGNED_APK"
          "$APKSIGNER" verify "$OUTPUT_APK"

          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "target_tag=$TARGET_TAG" >> $GITHUB_OUTPUT

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Uploading ${{ steps.sign-apk.outputs.apk_path }} to release ${{ steps.sign-apk.outputs.target_tag }}"
          gh release upload "${{ steps.sign-apk.outputs.target_tag }}" "${{ steps.sign-apk.outputs.apk_path }}" --clobber
