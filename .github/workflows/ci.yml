name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run test
      - name: Build frontend (embedded by tauri::generate_context!)
        run: bun run build
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  supabase:
    runs-on: ubuntu-24.04
    # Dummy OAuth values let local GoTrue start; these are not provider credentials.
    env:
      ANCHOA_GOOGLE_CLIENT_ID: local-test-google
      ANCHOA_GOOGLE_CLIENT_SECRET: local-test-google
      ANCHOA_GITHUB_CLIENT_ID: local-test-github
      ANCHOA_GITHUB_CLIENT_SECRET: local-test-github
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,storage,edge-runtime,logflare,vector,realtime,inbucket
      - run: supabase test db
      - run: supabase db lint --level error
