# Design mockups and docs are reference material, and landing/ is the marketing site, not product code.
# scripts/fake-llm.py is a localhost-only stand-in for Ollama used by the E2E check.
sonar.exclusions=docs/**,landing/**,scripts/fake-llm.py,src/**/*.test.ts,src/**/*.test.tsx,src/test/**
# Test files are test code: fixtures repeat by design, so they are left out of the duplication gate.
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.cpd.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
