<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Anchoa Downloads</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      width: 280px;
      background: #18181b;
      color: #f4f4f5;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #27272a;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
      color: #38bdf8;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 8px;
      background: #27272a;
      border-radius: 6px;
    }
    .badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
    }
    .badge.connected {
      background: #22c55e;
    }
    .toggle-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 10px;
    }
    .toggle-row input {
      margin-top: 2px;
      cursor: pointer;
    }
    .toggle-row label {
      cursor: pointer;
      line-height: 1.4;
      color: #d4d4d8;
    }
    .hint {
      margin-top: 12px;
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Anchoa Downloads</h1>
  </div>
  <div class="status-row">
    <span>Host Desktop:</span>
    <span id="hostStatus"><span class="badge" id="hostBadge"></span><span id="hostText">Mengecek...</span></span>
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="interceptToggle">
    <label for="interceptToggle">Otomatis ambil alih unduhan dari origin berikut:</label>
  </div>
  <textarea id="originsInput" placeholder="https://example.com&#10;https://archive.org" style="width: 100%; box-sizing: border-box; margin-top: 6px; background: #27272a; color: #f4f4f5; border: 1px solid #3f3f46; border-radius: 4px; font-size: 11px; padding: 4px; resize: vertical;" rows="3"></textarea>
  <div class="hint">
    Klik kanan tautan lalu pilih <b>Unduh dengan Anchoa</b> untuk mengunduh secara langsung.
  </div>
  <script src="popup.js"></script>
</body>
</html>
