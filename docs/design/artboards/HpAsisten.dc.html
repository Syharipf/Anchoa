<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const mode = st.mode || 'listening';
    const listening = mode === 'listening';
    const undone = !!st.undone;
    return {
      listening: listening,
      status: listening ? 'Mendengarkan…' : (mode === 'speaking' ? 'Berbicara' : 'Siap'),
      accent: listening ? '#FF8A7A' : '#C6F36B',
      motion: mode === 'idle' ? 'paused' : 'running',
      ringOpacity: mode === 'idle' ? '0.45' : '1',
      mouth: mode === 'speaking' ? 9 : 3,
      you: listening ? 'Kamu: “catat pengeluaran makan siang tiga puluh lima…”' : 'Kamu: “catat pengeluaran makan siang 35 ribu”',
      reply: listening ? '…' : (undone ? 'Oke, transaksinya kubatalkan.' : 'Kucatat Rp 35.000 untuk Makan, dari akun Tunai.'),
      showChips: !listening && !undone,
      undo: () => this.setState({ undone: true }),
      toggleMic: () => this.setState({ mode: listening ? 'speaking' : 'listening', undone: false }),
      micPressed: listening ? 'true' : 'false',
      micLabel: listening ? 'Berhenti mendengarkan' : 'Ketuk untuk bicara',
      micBg: listening ? '#FF8A7A' : '#C6F36B'
    };
  }
}
</script>
