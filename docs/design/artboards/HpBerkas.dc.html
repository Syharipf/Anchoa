<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Anchoa HP — File laptop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115;font-family:"IBM Plex Sans",system-ui,sans-serif;color:#E7E9EE}
a{color:#C6F36B}a:hover{color:#DDFA9E}
:where(button,a,input):focus-visible{outline:2px solid #C6F36B;outline-offset:2px}
[data-field]{transition:border-color .15s}[data-field]:focus-within{border-color:#4E6A26!important}
[data-hover]{transition:background-color .15s}[data-hover]:hover{background-color:#1D2129!important}
[data-row]{transition:background-color .15s}[data-row]:hover{background-color:#161A21!important}
[data-tile]{transition:background-color .15s,border-color .15s}[data-tile][aria-pressed="false"]:hover{background-color:#171A21!important}
[data-press]{transition:transform .15s ease}[data-press]:hover{transform:scale(1.05)}[data-press]:active{transform:scale(.95)}
[data-bar]{transition:width .3s ease}
[data-knob]{transition:transform .2s ease}
@keyframes anchoa-school{to{transform:rotate(360deg)}}
@keyframes anchoa-wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes anchoa-pulse{0%{transform:scale(1);opacity:.45}100%{transform:scale(1.7);opacity:0}}
@keyframes anchoa-pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes anchoa-slide{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}
@keyframes anchoa-fade{from{opacity:0}to{opacity:1}}
@keyframes anchoa-swim{from{transform:translateX(-72px)}to{transform:none}}@keyframes anchoa-swim-rev{from{transform:none}to{transform:translateX(-72px)}}@keyframes anchoa-wag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}@keyframes anchoa-roam{from{transform:translateX(-22%)}to{transform:translateX(100%)}}
@media (prefers-reduced-motion: reduce){[data-anim]{animation:none!important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: #0F1115; color: #E7E9EE; font-family: 'IBM Plex Sans', system-ui, sans-serif; overflow: hidden">
  <header style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px"><div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">File laptop</h1><span style="font-size: 12px; color: #9AA3B2">Online lewat Tailscale</span></div><button aria-label="Ganti lokasi" style="width: 44px; height: 44px; flex-shrink: 0; position: relative; border-radius: 12px; border: 0; background: #171A21; color: #C9CED8; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H4zM2 19h20"></path></svg></button></header>
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 16px 8px; font-size: 13px; color: #9AA3B2">
    <span>Laptop</span><span aria-hidden="true">/</span><span style="color: #E7E9EE">Foto</span>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #C6F36B"><span style="width: 7px; height: 7px; border-radius: 50%; background: #C6F36B"></span>24 ms</span>
  </div>
  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 0 16px 120px; display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{files}}" as="f" hint-placeholder-count="7">
      <button onClick="{{f.pick}}" aria-pressed="{{f.selected}}" style="min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px; border: 0; background: {{f.bg}}; color: #E7E9EE; font: inherit; text-align: left; cursor: pointer">
        <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; background: {{f.tile}}; color: #C9CED8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.icon}}"></path></svg></span>
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</span><span style="font-size: 12px; color: #9AA3B2">{{f.meta}}</span></span>
      </button>
    </sc-for>
  </div>
  <sc-if value="{{sheet}}" hint-placeholder-val="{{ true }}">
    <div data-anim role="dialog" aria-label="Pratinjau berkas" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 12px; background: #171A21; border-top: 1px solid #2E3440; border-radius: 20px 20px 0 0; box-shadow: 0 -16px 40px #00000080; animation: anchoa-pop 0.2s ease-out; z-index: 5">
      <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #3A4150"></span>
      <div style="position: relative; height: 210px; border-radius: 12px; background: #232833; display: flex; align-items: center; justify-content: center; color: #5B6475"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15 9h.01"></path></svg><span style="position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: #9AA3B2">Pratinjau diperkecil · 320 KB dari 4,2 MB</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{sel.name}}</span><span style="font-size: 12px; color: #9AA3B2">{{sel.meta}}</span></div>
      <sc-if value="{{saving}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 6px"><span aria-hidden="true" style="position: relative; display: block; height: 12px; border-radius: 6px; background: {{saveFb.track}}"><span data-bar style="position: absolute; top: 0; left: 0; bottom: 0; width: {{saveFb.pct}}%; border-radius: 6px; overflow: hidden; background: {{saveFb.tint}}"><span data-anim style="position: absolute; top: 0; bottom: 0; left: 0; width: calc(100% + 72px); background-image: {{saveFb.img}}; background-repeat: repeat-x; background-size: 72px 12px; background-position: left center; animation: {{saveFb.anim}}"></span></span><sc-if value="{{saveFb.lead}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -0px; left: calc({{saveFb.pct}}% - 18px); transition: left 0.3s ease"><svg data-anim width="21" height="12" viewBox="-11 -5 20 10" aria-hidden="true" style="display: block; overflow: visible; transform-origin: 80% 50%; animation: anchoa-wag 0.45s ease-in-out infinite"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill="{{saveFb.leadColor}}" stroke="#0F1115" stroke-width="0.8" paint-order="stroke"></path></svg></span></sc-if><sc-if value="{{saveFb.roam}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 6px; overflow: hidden"><span data-anim style="position: absolute; top: 0; left: 0; width: 100%; height: 12px; animation: anchoa-roam 3.4s linear infinite"><svg width="48" height="12" viewBox="0 0 48 12" aria-hidden="true" style="display: block"><g transform="translate(10 4.5) scale(0.60)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill="#9AA3B2" fill-opacity="0.55"></path></g><g transform="translate(24 8.0) scale(0.66)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill="#9AA3B2" fill-opacity="0.70"></path></g><g transform="translate(37 5.0) scale(0.56)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill="#9AA3B2" fill-opacity="0.50"></path></g></svg></span></span></sc-if></span><span aria-live="polite" style="font-size: 12px; color: {{saveColor}}">{{saveNote}}</span></div>
      </sc-if>
      <div style="display: flex; gap: 8px">
        <button data-press onClick="{{save}}" style="flex-grow: 1; min-height: 46px; border-radius: 12px; border: 0; background: #C6F36B; color: #0F1115; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{saveLabel}}</button>
        <button data-hover style="min-height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid #3A4150; background: transparent; color: #E7E9EE; font: inherit; font-size: 14px; cursor: pointer">Bagikan</button>
        <button data-hover onClick="{{close}}" aria-label="Tutup pratinjau" style="width: 46px; min-height: 46px; border-radius: 12px; border: 1px solid #3A4150; background: transparent; color: #9AA3B2; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
    </div>
  </sc-if>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 136px; z-index: 2; background: linear-gradient(180deg, rgba(15,17,21,0) 0%, rgba(15,17,21,0.94) 42%, #0F1115 60%); pointer-events: none"></div>
  <button aria-label="Tutup roda menu" tabindex="-1" onClick="{{wheel.toggle}}" style="position: absolute; top: 0; left: 0; width: 390px; height: 844px; z-index: 3; margin: 0; padding: 0; border: 0; background: rgba(5,7,10,0.76); opacity: {{wheel.scrimOp}}; pointer-events: {{wheel.scrimPe}}; transition: opacity 0.25s; cursor: default"></button>
  <nav aria-label="Menu utama" style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; z-index: 4; pointer-events: none">
    <div onPointerDown="{{wheel.down}}" onPointerMove="{{wheel.move}}" onPointerUp="{{wheel.up}}" onPointerCancel="{{wheel.up}}" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; touch-action: none; pointer-events: {{wheel.ringPe}}">
      <div aria-hidden="true" style="position: absolute; left: 37px; top: 78px; width: 316px; height: 316px; border-radius: 50%; box-sizing: border-box; background: #0B0D10; border: 1px solid #262B35; opacity: {{wheel.ringOp}}; transform: scale({{wheel.ringScale}}); transition: transform 0.4s cubic-bezier(.2,.8,.2,1), opacity 0.25s"></div>
      <svg aria-hidden="true" width="224" height="224" viewBox="-112 -112 224 224" style="position: absolute; left: 83px; top: 124px; overflow: visible; opacity: {{wheel.ringOp}}; transition: opacity 0.25s"><circle r="112" fill="none" stroke="#2E3440" stroke-dasharray="2 9"></circle></svg>
      <div aria-hidden="true" style="position: absolute; left: 195px; top: 236px; width: 0; height: 0; transform: rotate({{wheel.fishDeg}}deg) scale({{wheel.fishScale}}); transition: {{wheel.fishTrans}}">
        <svg data-anim width="180" height="180" viewBox="-90 -90 180 180" style="position: absolute; left: -90px; top: -90px; color: #C6F36B; fill: currentColor; overflow: visible; animation: anchoa-school 16s linear infinite"><g transform="rotate(0.0) translate(0 -75) rotate(-8) scale(0.80)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.35"></path></g><g transform="rotate(17.4) translate(0 -65) rotate(3) scale(1.10)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.45"></path></g><g transform="rotate(34.7) translate(0 -77) rotate(-3) scale(0.90)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.55"></path></g><g transform="rotate(52.1) translate(0 -67) rotate(8) scale(1.20)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.65"></path></g><g transform="rotate(69.5) translate(0 -75) rotate(2) scale(1.00)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.75"></path></g><g transform="rotate(86.8) translate(0 -65) rotate(-4) scale(0.80)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.35"></path></g><g transform="rotate(98.2) translate(0 -77) rotate(7) scale(1.10)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.45"></path></g><g transform="rotate(115.5) translate(0 -67) rotate(1) scale(0.90)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.55"></path></g><g transform="rotate(132.9) translate(0 -75) rotate(-5) scale(1.20)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.65"></path></g><g transform="rotate(150.3) translate(0 -65) rotate(6) scale(1.00)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.75"></path></g><g transform="rotate(167.6) translate(0 -77) rotate(0) scale(0.80)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.35"></path></g><g transform="rotate(185.0) translate(0 -67) rotate(-6) scale(1.10)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.45"></path></g><g transform="rotate(196.4) translate(0 -75) rotate(5) scale(0.90)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.55"></path></g><g transform="rotate(213.7) translate(0 -65) rotate(-1) scale(1.20)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.65"></path></g><g transform="rotate(231.1) translate(0 -77) rotate(-7) scale(1.00)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.75"></path></g><g transform="rotate(248.5) translate(0 -67) rotate(4) scale(0.80)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.35"></path></g><g transform="rotate(265.8) translate(0 -75) rotate(-2) scale(1.10)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.45"></path></g><g transform="rotate(283.2) translate(0 -65) rotate(-8) scale(0.90)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.55"></path></g><g transform="rotate(294.5) translate(0 -77) rotate(3) scale(1.20)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.65"></path></g><g transform="rotate(311.9) translate(0 -67) rotate(-3) scale(1.00)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.75"></path></g><g transform="rotate(329.3) translate(0 -75) rotate(8) scale(0.80)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.35"></path></g><g transform="rotate(346.6) translate(0 -65) rotate(2) scale(1.10)"><path d="M-7 0C-3-2.4 3-2.6 7 0C3 2.6-3 2.4-7 0ZM-6 0L-10.5-2.8L-9.2 0L-10.5 2.8Z" fill-opacity="0.45"></path></g></svg>
      </div>
      <div aria-hidden="{{wheel.ringHidden}}" style="position: absolute; left: 195px; top: 236px; width: 0; height: 0; opacity: {{wheel.ringOp}}; transform: rotate({{wheel.deg}}deg) scale({{wheel.ringScale}}); transition: {{wheel.trans}}">
        <sc-for list="{{wheel.items}}" as="w" hint-placeholder-count="11">
          <button onClick="{{w.pick}}" aria-label="{{w.label}}" aria-current="{{w.current}}" tabindex="{{w.tab}}" style="position: absolute; left: {{w.x}}px; top: {{w.y}}px; width: 52px; height: 52px; margin: -26px 0 0 -26px; padding: 0; border-radius: 50%; border: 1px solid {{w.border}}; background: {{w.bg}}; color: {{w.color}}; opacity: {{w.op}}; transform: rotate({{w.counter}}deg) scale({{w.scale}}); transition: {{w.trans}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{w.icon}}"></path></svg></button>
        </sc-for>
      </div>
      <span aria-live="polite" style="position: absolute; left: 0; right: 0; top: 170px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: #E7E9EE; text-shadow: 0 0 4px #0B0D10, 0 0 8px #0B0D10, 0 0 12px #0B0D10; opacity: {{wheel.ringOp}}; transition: opacity 0.2s; pointer-events: none">{{wheel.label}}</span>
      <sc-if value="{{wheel.other}}" hint-placeholder-val="{{ false }}">
        <a href="{{wheel.href}}" style="position: absolute; left: 50%; top: 54px; transform: translateX(-50%); min-height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 999px; background: #C6F36B; color: #0F1115; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; box-shadow: 0 8px 20px #00000080">Buka {{wheel.label}} ›</a>
      </sc-if>
      <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 274px; text-align: center; font-size: 11px; color: #5B6475; opacity: {{wheel.ringOp}}; transition: opacity 0.2s; pointer-events: none">geser kiri / kanan</span>
    </div>
    <a href="HpCari.dc.html" aria-label="Cari atau jalankan perintah" tabindex="{{wheel.sideTab}}" style="position: absolute; top: 210px; width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer; transition: opacity 0.2s; left: 40px; background: #171A21; color: #C9CED8; opacity: {{wheel.sideOp}}; pointer-events: {{wheel.sidePe}}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM20 20l-4-4"></path></svg></a>
