<style>
body{margin:0;background:#0F1115;font-family:"IBM Plex Sans",system-ui,sans-serif;color:#E7E9EE}
a{color:#C6F36B}a:hover{color:#DDFA9E}
:where(button,a,input):focus-visible{outline:2px solid #C6F36B;outline-offset:2px}
[data-field]{transition:border-color .15s}[data-field]:focus-within{border-color:#4E6A26!important}
[data-hover]{transition:background-color .15s}[data-hover]:hover{background-color:#1D2129!important}
[data-row]{transition:background-color .15s}[data-row]:hover{background-color:#161A21!important}
[data-tile]{transition:background-color .15s,border-color .15s}[data-tile][aria-pressed="false"]:hover{background-color:#171A21!important}
[data-press]{transition:transform .15s ease}[data-press]:hover{transform:scale(1.05)}[data-press]:active{transform:scale(.95)}
[data-bar]{transition:width .3s ease}
[data-knob]{transition:transform .2s ease}
@keyframes anchoa-school{to{transform:rotate(360deg)}}
@keyframes anchoa-wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes anchoa-pulse{0%{transform:scale(1);opacity:.45}100%{transform:scale(1.7);opacity:0}}
@keyframes anchoa-pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes anchoa-slide{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}
@keyframes anchoa-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){[data-anim]{animation:none!important}}
</style>

      ['habit', 'Habit', 'HpHabit.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM8 12.5l2.7 2.7L16.5 9.5'],
      ['jadwal', 'Jadwal', 'HpJadwal.dc.html', 'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4'],
      ['keuangan', 'Keuangan', 'HpKeuangan.dc.html', 'M3 6h18v13H3zM16 12.5h2M3 10h18'],
      ['proyek', 'Proyek', 'HpProyek.dc.html', 'M3 3h18v18H3zM8 7v7M12 7v4M16 7v10'],
      ['agen', 'Agen kode', 'HpAgen.dc.html', 'M4 17l6-6-6-6M12 19h8'],
      ['email', 'Email', 'HpEmail.dc.html', 'M3 5h18v14H3zM3 7l9 6 9-6'],
      ['berkas', 'Berkas', 'HpBerkas.dc.html', 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'],
      ['unduhan', 'Unduhan', 'HpUnduhan.dc.html', 'M12 4v11M7 10l5 5 5-5M5 20h14'],
      ['pengaturan', 'Pengaturan', 'HpPengaturan.dc.html', 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6zM12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4']
    ];
    const wheelOf = (s) => {
      const N = WHEEL.length, step = 360 / N, home = 3, R = 112, ease = 'cubic-bezier(.2,.8,.2,1)';
      const open = s.wopen === undefined ? false : !!s.wopen, drag = !!s.wdrag;
      const rot = s.wrot === undefined ? -home * step : s.wrot;
      const norm = (d) => { let x = ((d % 360) + 360) % 360; return x > 180 ? x - 360 : x; };
      const snap = (r) => Math.round(r / step) * step;
      const at = Math.round(norm(-rot) / step + N) % N;
      const turn = (d) => this.setState({ wrot: snap(rot) + d * step });
      return {
        expanded: open ? 'true' : 'false',
        toggle: () => this.setState(open ? { wopen: false, wrot: -home * step, wdrag: false } : { wopen: true }),
        hubLabel: open ? 'Tutup roda menu' : 'Menu: ' + WHEEL[home][1] + '. Buka roda menu',
        hubIcon: open ? 'M6 6l12 12M18 6L6 18' : WHEEL[home][3],
        hubBg: open ? '#1D2129' : '#171A21', hubColor: open ? '#E7E9EE' : '#C6F36B', hubBorder: open ? '#3A4150' : '#4E6A26',
        homeLabel: WHEEL[home][1],
        sideOp: open ? 0 : 1, sidePe: open ? 'none' : 'auto', sideTab: open ? '-1' : '0',
        arrowOp: open ? 1 : 0, arrowPe: open ? 'auto' : 'none', arrowTab: open ? '0' : '-1',
        scrimOp: open ? 1 : 0, scrimPe: open ? 'auto' : 'none',
        ringOp: open ? 1 : 0, ringPe: open ? 'auto' : 'none', ringScale: open ? 1 : 0.3, ringHidden: open ? 'false' : 'true',
        deg: rot, trans: drag ? 'opacity 0.25s' : 'transform 0.45s ' + ease + ', opacity 0.25s',
        fishDeg: rot * 1.6, fishScale: open ? 1 : 0.58, fishTrans: drag ? 'none' : 'transform 0.7s ' + ease,
        label: WHEEL[at][1], href: WHEEL[at][2], other: open && at !== home,
        prev: () => turn(1), next: () => turn(-1),
        down: (e) => { if (!open || !e) return; this._wd = { x: e.clientX, r: rot, id: e.pointerId, moved: false }; },
        move: (e) => {
          const d = this._wd; if (!d || !e) return;
          const dx = e.clientX - d.x;
          if (!d.moved) { if (Math.abs(dx) < 6) return; d.moved = true; try { e.currentTarget.setPointerCapture(d.id); } catch (err) {} }
          this.setState({ wrot: d.r + dx * 0.6, wdrag: true });
        },
        up: () => { const d = this._wd; this._wd = null; if (d && d.moved) this.setState({ wrot: snap((this.state || {}).wrot || 0), wdrag: false }); },
        items: WHEEL.map((w, i) => {
          const th = i * step * Math.PI / 180, e = norm(i * step + rot), vis = open && Math.abs(e) <= 72, on = i === at;
          return {
            label: w[1], icon: w[3], x: Math.round(R * Math.sin(th)), y: Math.round(-R * Math.cos(th)), counter: -rot,
            op: vis ? (on ? 1 : 0.8) : 0, tab: vis ? '0' : '-1', scale: on ? 1.12 : 0.92,
            current: i === home ? 'page' : 'false',
            trans: drag ? 'opacity 0.3s' : 'transform 0.45s ' + ease + ', opacity 0.3s, background-color 0.3s',
            bg: on ? '#C6F36B' : '#171A21', color: on ? '#0F1115' : (i === home ? '#C6F36B' : '#C9CED8'), border: on ? '#C6F36B' : (i === home ? '#4E6A26' : '#2E3440'),
            pick: () => { this.setState({ wrot: rot + norm(-i * step - rot) }); }
          };
        })
      };
    };
    const tabsOf = (key, def, opts) => {
      const cur = st[key] === undefined ? def : st[key];
      return opts.map((o) => ({ label: o[1], pressed: cur === o[0] ? 'true' : 'false', bg: cur === o[0] ? '#2A303B' : 'transparent', color: cur === o[0] ? '#E7E9EE' : '#9AA3B2', pick: () => { const p = {}; p[key] = o[0]; this.setState(p); } }));
    };

    const CAT = { proyek: '#3987E5', tagihan: '#C98500', pribadi: '#D55181' };
    const T = {
      '28-9': [['Bayar listrik', 'tagihan', 'Tagihan · Rp 312.000', 'terlambat']],
      '29-9': [['Kirim laporan project', 'proyek', 'Laporan project', '18.00'], ['Telepon bengkel', 'pribadi', 'Pribadi', 'hari ini']],
      '3-10': [['Halaman Keuangan', 'proyek', 'Anchoa v1', '—'], ['Belanja bulanan', 'pribadi', 'Pribadi', '10.00']],
      '5-10': [['Kumpulkan referensi', 'proyek', 'Riset topik baru', '—'], ['Bayar internet', 'tagihan', 'Tagihan · Rp 350.000', '—']],
      '6-10': [['Pipeline TTS', 'proyek', 'Anchoa v1', '—']]
    };
    const view = st.view || 'week';
    const sel = st.sel || '29-9';
    const done = st.done || {};
    const WEEK = [['Sen', 28, 9], ['Sel', 29, 9], ['Rab', 30, 9], ['Kam', 1, 10], ['Jum', 2, 10], ['Sab', 3, 10], ['Min', 4, 10]];
    const dotsOf = (k) => (T[k] || []).map((t) => ({ c: CAT[t[1]] })).slice(0, 3);
    const DN = { 9: 'September', 10: 'Oktober' };
    const DAYN = { '28-9': 'Senin', '29-9': 'Selasa', '30-9': 'Rabu', '1-10': 'Kamis', '2-10': 'Jumat', '3-10': 'Sabtu', '4-10': 'Minggu', '5-10': 'Senin', '6-10': 'Selasa' };
    const month = [];
    month.push({ n: '31', aria: '31 Agustus', dots: [], bg: 'transparent', border: 'transparent', color: '#3A4150', pick: () => {} });
    for (let d = 1; d <= 30; d++) {
      const k = d + '-9', on = k === sel, today = d === 29;
      month.push({ n: String(d), aria: d + ' September', dots: dotsOf(k).slice(0, 1), bg: on ? '#1D2129' : 'transparent', border: today ? '#C6F36B' : (on ? '#2E3440' : 'transparent'), color: d < 29 ? '#9AA3B2' : '#E7E9EE', pick: () => this.setState({ sel: k }) });
    }
    for (let d = 1; d <= 4; d++) { const k = d + '-10'; month.push({ n: String(d), aria: d + ' Oktober', dots: dotsOf(k).slice(0, 1), bg: k === sel ? '#1D2129' : 'transparent', border: 'transparent', color: '#5B6475', pick: () => this.setState({ sel: k }) }); }
    const items = (T[sel] || []).map((t, i) => {
      const key = sel + ':' + i, d = !!done[key], late = t[3] === 'terlambat' && !d;
      return { title: t[0], sub: t[2], due: d ? 'selesai' : t[3], cat: CAT[t[1]], checked: d ? 'true' : 'false', aria: 'Tandai ' + t[0] + (d ? ' belum selesai' : ' selesai'),
        box: d ? '#C6F36B' : '#3A4150', fill: d ? '#C6F36B' : 'transparent', tick: d ? '1' : '0', color: d ? '#8A93A3' : '#E7E9EE',
        dueColor: late ? '#FF8A7A' : '#9AA3B2', rowBg: late ? '#221A1C' : '#171A21', border: late ? '#5A2E2B' : '#262B35',
        toggle: () => { const x = Object.assign({}, done); x[key] = !d; this.setState({ done: x }); } };
    });
    const [dd, mm] = sel.split('-');
    return { wheel: wheelOf(st),
      tabs: tabsOf('view', 'week', [['week', 'Minggu ini'], ['month', 'Bulan']]),
      isWeek: view === 'week', isMonth: view === 'month',
      week: WEEK.map((w) => { const k = w[1] + '-' + w[2], on = k === sel, today = w[1] === 29; return { dn: w[0], n: w[1], aria: w[0] + ' ' + w[1], dots: dotsOf(k), pressed: on ? 'true' : 'false', bg: on ? '#1D2129' : 'transparent', border: on ? '#2E3440' : 'transparent', numBg: today ? '#C6F36B' : 'transparent', numColor: today ? '#0F1115' : '#E7E9EE', pick: () => this.setState({ sel: k }) }; }),
      wd: ['S', 'S', 'R', 'K', 'J', 'S', 'M'], month: month,
      dayTitle: (DAYN[sel] || '') + ', ' + dd + ' ' + DN[mm] + (sel === '29-9' ? ' · hari ini' : ''),
      dayCount: items.length ? items.length + ' item' : '',
      agenda: items, empty: items.length === 0
    };
  }
}
