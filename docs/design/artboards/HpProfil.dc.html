<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sw = (key, def) => {
      const on = st[key] === undefined ? def : st[key];
      return { on: on ? 'true' : 'false', track: on ? '#C6F36B' : '#3A4150', knob: on ? '#0F1115' : '#9AA3B2', shift: on ? 20 : 0,
        toggle: () => { const p = {}; p[key] = !on; this.setState(p); } };
    };
    const seg = (key, def, opts) => {
      const cur = st[key] === undefined ? def : st[key];
      return opts.map((o) => ({ label: o[1], pressed: cur === o[0] ? 'true' : 'false', bg: cur === o[0] ? '#2A303B' : 'transparent',
        color: cur === o[0] ? '#E7E9EE' : '#9AA3B2', pick: () => { const p = {}; p[key] = o[0]; this.setState(p); } }));
    };
    const segVal = (key, def) => (st[key] === undefined ? def : st[key]);

    return {
      swPin: sw('pin', true), swDnd: sw('dnd', false), swWake: sw('wake', false),
      accounts: [['GH', 'Repo kode', 'Untuk heatmap & agen kode', '#C6F36B'], ['@', 'Email', 'syharipf@contoh.id · IMAP', '#C6F36B'], ['TS', 'Tailscale', 'pixel-rip · tailnet pribadi', '#C6F36B']].map((a, i) => ({ ab: a[0], name: a[1], sub: a[2], color: a[3], line: i === 0 ? 'transparent' : '#262B35' }))
    };
  }
}
</script>
