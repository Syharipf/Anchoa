<style>

a{color:#C6F36B}a:hover{color:#DDFA9E}

[data-field]{transition:border-color .15s}[data-field]:focus-within{border-color:#4E6A26!important}

@keyframes anchoa-wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}

@media (prefers-reduced-motion: reduce){[data-anim]{animation:none!important}}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() { this.start(); }
  componentWillUnmount() { if (this.timer) clearInterval(this.timer); if (this.first) clearTimeout(this.first); }
  start() {
    // intro animation plays 2.2 s, then each loading step ~0.85 s
    if (this.timer) clearInterval(this.timer);
    if (this.first) clearTimeout(this.first);
    this.first = setTimeout(() => {
      this.setState({ step: 1 });
      this.timer = setInterval(() => {
        const s = (this.state && this.state.step) || 0;
        if (s >= 4) { clearInterval(this.timer); this.timer = null; return; }
        this.setState({ step: s + 1 });
      }, 850);
    }, 2200);
  }
  renderVals() {
    const st = this.state || {};
    const step = st.step || 0;
    const STEPS = ['Memuat cache di perangkat…', 'Memuat model suara (STT & TTS)…', 'Membangunkan Ako…', 'Menyinkronkan jadwal & email…', 'Siap.'];
    const done = step >= 4;
    return {
      stepText: STEPS[Math.min(step, 4)],
      stepColor: done ? '#C6F36B' : '#9AA3B2',
      prog: Math.min(step, 4) / 4 * 0.94 + 0.06,
      done: done,
      phIntro: step === 0, phLoad: step > 0 && !done, phDone: done,
      replay: () => { this.setState({ step: 0, k: (st.k || 0) + 1 }); this.start(); }
    };
  }
}
</script>
