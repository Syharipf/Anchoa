# Contoh deploy ke proyek Supabase cloud (Fase F). Butuh GitHub Secrets:
# SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, PROJECT_REF
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push
      - run: supabase functions deploy --project-ref "$PROJECT_REF"
