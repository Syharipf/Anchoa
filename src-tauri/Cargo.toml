[package]
name = "anchoa"
version = "0.18.0"
edition = "2024"

[lib]
name = "anchoa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
log = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
jiff = "0.2.37"
tauri-plugin-opener = "2.6.0"
uuid = { version = "1.26.1", features = ["v7"] }
ureq = { version = "3.4.2", features = ["json"] }
sha2 = "0.10"
serde_json = "1.0.151"
tauri-plugin-dialog = "2"
argon2 = { version = "0.5", features = ["std", "zeroize"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "hostname"] }
mail-parser = "0.11"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
chacha20poly1305 = "0.10"
miniz_oxide = "0.8.9"
zeroize = "1.9.0"
tokio = { version = "1", features = ["net", "io-util", "rt", "time", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.test.package.argon2]
opt-level = 3

[profile.test.package.chacha20poly1305]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
